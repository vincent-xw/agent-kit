<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Browser AI Assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.8/dist/index.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; margin: 0; }
#app { height: 100vh; display: flex; flex-direction: column; }
.chat-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #e4e7ed; flex-shrink: 0; background: #fff; }
.chat-header h1 { font-size: 16px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: #f5f7fa; }
.msg { max-width: 100%; }
.msg.user { text-align: right; }
.msg.user .bubble { display: inline-block; background: #409eff; color: #fff; padding: 8px 14px; border-radius: 8px 8px 2px 8px; text-align: left; max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.5; }
.msg.assistant .bubble { display: inline-block; background: #fff; padding: 8px 14px; border-radius: 8px 8px 8px 2px; max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.msg.error .bubble { background: #fef0f0; color: #f56c6c; }
.tool-card { margin: 6px 0; font-size: 13px; }
.tool-card .el-card__body { padding: 10px 14px; }
.tool-card .tool-header { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.tool-card .tool-name { font-weight: 600; flex: 1; }
.tool-card .tool-body { margin-top: 8px; border-top: 1px solid #ebeef5; padding-top: 8px; }
.tool-card .tool-body pre { background: #f5f7fa; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 12px; margin: 4px 0; max-height: 200px; overflow-y: auto; }
#input-area { padding: 8px 12px; border-top: 1px solid #e4e7ed; background: #fff; flex-shrink: 0; }
#input-area .input-row { display: flex; gap: 8px; align-items: flex-end; }
#input-area textarea { flex: 1; resize: none; font-size: 14px; min-height: 36px; max-height: 120px; }
#prompt-bar { padding: 4px 12px; border-top: 1px solid #e4e7ed; background: #fafafa; flex-shrink: 0; }
.sss-indicator { font-size: 12px; color: #909399; }
</style>
</head>
<body>
<div id="app">
  <div class="chat-header">
    <h1>浏览器 AI 助手</h1>
    <span class="sse-indicator" v-if="sseConnected">● SSE 已连接</span>
    <span class="sse-indicator" v-else style="color:#f56c6c">● SSE 断开</span>
    <el-button size="small" @click="newSession">新建</el-button>
  </div>

  <div id="messages" ref="msgContainer">
    <div v-for="(msg, i) in messages" :key="i" :class="'msg ' + msg.role">
      <div class="bubble">
        <div v-if="msg.role === 'assistant' && msg.toolCalls">
          <div v-for="(tc, j) in msg.toolCalls" :key="j" class="tool-card">
            <el-card shadow="never">
              <div class="tool-header" @click="toggleTool(tc.callId)">
                <span class="tool-name">{{ tc.toolName }}</span>
                <el-tag v-if="tc.status === 'running'" type="warning" size="small">运行中</el-tag>
                <el-tag v-else-if="tc.status === 'ok'" type="success" size="small">{{ tc.durationMs }}ms</el-tag>
                <el-tag v-else-if="tc.status === 'fail'" type="danger" size="small">失败</el-tag>
                <el-icon><el-icon-arrow-down v-if="!tc.expanded" /><el-icon-arrow-up v-else /></el-icon>
              </div>
              <div v-if="tc.expanded" class="tool-body">
                <pre>输入: {{ JSON.stringify(tc.input, null, 2) }}</pre>
                <pre v-if="tc.output">输出: {{ typeof tc.output === 'string' ? tc.output : JSON.stringify(tc.output, null, 2) }}</pre>
              </div>
            </el-card>
          </div>
          <div v-if="msg.text" style="margin-top:8px">{{ msg.text }}</div>
        </div>
        <div v-else-if="msg.role === 'user'">{{ msg.text }}</div>
        <div v-else-if="msg.role === 'error'">{{ msg.text }}</div>
        <div v-else>{{ msg.text }}</div>
      </div>
    </div>
  </div>

  <div id="prompt-bar">
    <el-select v-model="promptName" size="small" style="width:100%">
      <el-option value="free-form" label="自由指令" />
      <el-option value="planning" label="规划" />
      <el-option value="browser-automation" label="浏览器自动化" />
      <el-option value="candidate-assessment" label="评估" />
    </el-select>
  </div>

  <div id="input-area">
    <div class="input-row">
      <el-input
        v-model="inputText"
        type="textarea"
        :rows="2"
        :disabled="running"
        placeholder="描述你想做的事..."
        @keydown.enter.prevent="!$event.shiftKey && send()"
      />
      <el-button type="primary" :loading="running" @click="send" :disabled="!inputText.trim()">发送</el-button>
      <el-button v-if="running" type="danger" @click="stop">停止</el-button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.8/dist/index.full.min.js"></script>
<script>
const { createApp, ref, nextTick, onMounted, onUnmounted } = Vue;

createApp({
  setup() {
    const inputText = ref('');
    const messages = ref([]);
    const running = ref(false);
    const promptName = ref('free-form');
    const sseConnected = ref(false);
    const msgContainer = ref(null);
    let eventSource = null;
    let abortController = null;
    let sessionId = localStorage.getItem('bff-session-id') || crypto.randomUUID();

    function saveSessionId() { localStorage.setItem('bff-session-id', sessionId); }

    function scrollBottom() {
      nextTick(() => { if (msgContainer.value) msgContainer.value.scrollTop = msgContainer.value.scrollHeight; });
    }

    function addMsg(role, text, toolCalls) {
      messages.value.push({ role, text, toolCalls: toolCalls || [] });
      scrollBottom();
    }

    function toggleTool(callId) {
      for (const msg of messages.value) {
        if (msg.toolCalls) {
          for (const tc of msg.toolCalls) {
            if (tc.callId === callId) tc.expanded = !tc.expanded;
          }
        }
      }
    }

    function connectSSE() {
      if (eventSource) eventSource.close();
      const params = new URLSearchParams(location.search);
      const token = params.get('token') || '';
      if (!token) return;
      eventSource = new EventSource('/api/events?token=' + encodeURIComponent(token) + '&sessionId=' + encodeURIComponent(sessionId));
      eventSource.onopen = () => { sseConnected.value = true; };
      eventSource.addEventListener('tool_start', (e) => {
        try {
          const d = JSON.parse(e.data);
          // Find the last assistant message and add a tool call
          for (let i = messages.value.length - 1; i >= 0; i--) {
            const msg = messages.value[i];
            if (msg.role === 'assistant') {
              if (!msg.toolCalls) msg.toolCalls = [];
              msg.toolCalls.push({ callId: d.callId, toolName: d.toolName, input: d.input, status: 'running', expanded: false });
              break;
            }
          }
          scrollBottom();
        } catch {}
      });
      eventSource.addEventListener('tool_end', (e) => {
        try {
          const d = JSON.parse(e.data);
          for (const msg of messages.value) {
            if (msg.toolCalls) {
              for (const tc of msg.toolCalls) {
                if (tc.callId === d.callId) {
                  tc.status = d.ok ? 'ok' : 'fail';
                  tc.output = d.outputPreview;
                  tc.durationMs = d.durationMs;
                }
              }
            }
          }
          scrollBottom();
        } catch {}
      });
      eventSource.addEventListener('error', () => {});
    }

    function disconnectSSE() {
      if (eventSource) eventSource.close();
      eventSource = null;
      sseConnected.value = false;
    }

    async function send() {
      const text = inputText.value.trim();
      if (!text || running.value) return;
      inputText.value = '';
      running.value = true;
      abortController = new AbortController();
      addMsg('user', text);
      saveSessionId();

      const params = new URLSearchParams(location.search);
      const token = params.get('token') || '';
      const bffUrl = location.origin;

      try {
        const response = await fetch(bffUrl + '/v1/agent/sessions/' + encodeURIComponent(sessionId) + '/run', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + token },
          body: JSON.stringify({ input: text, context: { currentDate: new Date().toISOString() }, stepMode: true, promptName: promptName.value }),
          signal: abortController.signal,
        });
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          addMsg('error', '请求失败: ' + (err.message || response.statusText));
          return;
        }
        const result = await response.json();
        const output = typeof result.output === 'string' ? result.output : JSON.stringify(result.output, null, 2);
        addMsg('assistant', output);
      } catch (err) {
        if (err.name === 'AbortError') return;
        addMsg('error', '请求失败: ' + err.message);
      } finally {
        running.value = false;
        abortController = null;
      }
    }

    function stop() {
      abortController?.abort();
      running.value = false;
    }

    function newSession() {
      sessionId = crypto.randomUUID();
      saveSessionId();
      messages.value = [];
      disconnectSSE();
      connectSSE();
    }

    onMounted(() => {
      connectSSE();
    });

    onUnmounted(() => {
      disconnectSSE();
    });

    return {
      inputText, messages, running, promptName, sseConnected, msgContainer,
      send, stop, newSession, toggleTool,
    };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
