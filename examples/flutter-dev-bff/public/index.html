<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flutter Dev Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
    --text: #e0e0e0; --text2: #a0a0b0; --accent: #4fc3f7;
    --accent2: #66bb6a; --error: #ef5350; --border: #2a2a4a;
    --tool-bg: #1e2a4a; --tool-border: #2a3a5a;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .status { font-size: 12px; color: var(--text2); }
  header .status.connected { color: var(--accent2); }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--surface2); color: var(--text); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.tool { align-self: flex-start; background: var(--tool-bg); border: 1px solid var(--tool-border); border-radius: 8px; padding: 8px 12px; font-size: 13px; max-width: 90%; }
  .msg.tool .tool-name { font-weight: 600; color: var(--accent); }
  .msg.tool .tool-status { color: var(--text2); font-size: 12px; }
  .msg.tool .tool-output { margin-top: 6px; color: var(--text2); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
  .msg.error { border-color: var(--error); color: var(--error); }
  .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
  .msg code { background: rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 3px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
  .msg pre { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
  .msg pre code { background: none; padding: 0; }
  #input-bar { padding: 16px 20px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; resize: none; min-height: 42px; max-height: 120px; font-family: inherit; }
  #input:focus { outline: none; border-color: var(--accent); }
  #send { padding: 8px 20px; background: var(--accent); color: var(--bg); border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  #stop { padding: 8px 20px; background: transparent; color: var(--error); border: 1px solid var(--error); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .hidden { display: none !important; }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 6px; height: 6px; background: var(--text2); border-radius: 50%; animation: blink 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  .prompt-select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Flutter Dev Agent</h1>
  <select class="prompt-select" id="prompt">
    <option value="free-form">自由模式</option>
    <option value="debugging">调试模式</option>
    <option value="testing">测试模式</option>
  </select>
  <span class="status" id="status">就绪</span>
</header>
<div id="messages"></div>
<div id="input-bar">
  <textarea id="input" rows="1" placeholder="输入指令，例如：启动应用并检查首页是否正常显示..." autofocus></textarea>
  <button id="send">发送</button>
  <button id="stop" class="hidden">停止</button>
</div>

<script>
const TOKEN = localStorage.getItem('bff_token') || 'dev-token';
const PORT = location.port || '8788';
const BASE = '';
let sessionId = localStorage.getItem('flutter_session_id') || ('sess-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8));
localStorage.setItem('flutter_session_id', sessionId);
let running = false;

// 工具事件实时流。EventSource 不支持自定义请求头，token 走查询参数。
// 断线自动重连，重连时浏览器自动带上 Last-Event-ID，服务端据此重放断开期间的事件。
const toolEls = new Map();

function connectEvents() {
  const es = new EventSource(`/api/events?token=${encodeURIComponent(TOKEN)}`);

  es.addEventListener('tool_start', (e) => {
    const data = JSON.parse(e.data);
    const el = addToolMessage(data.name, '执行中…');
    toolEls.set(data.name, el);
  });

  es.addEventListener('tool_end', (e) => {
    const data = JSON.parse(e.data);
    const el = toolEls.get(data.name);
    const status = data.ok ? `完成 ${data.durationMs}ms` : `失败 ${data.durationMs}ms`;
    const detail = data.ok ? data.output : data.error;
    if (el) {
      el.className = 'msg tool' + (data.ok ? '' : ' error');
      el.innerHTML = `<div><span class="tool-name">${escapeHtml(data.name)}</span> <span class="tool-status">${escapeHtml(status)}</span></div>`
        + (detail ? `<div class="tool-output">${escapeHtml(String(detail).slice(0, 500))}</div>` : '');
      toolEls.delete(data.name);
    } else {
      addToolMessage(data.name, status, detail);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });

  es.onerror = () => {
    // EventSource 会自行重连，这里只反映连接状态，不手动重建。
    statusEl.textContent = running ? '思考中…（事件流重连中）' : '事件流重连中…';
  };

  es.onopen = () => {
    if (!running) statusEl.textContent = '就绪';
  };

  return es;
}

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
let stopRequested = false;
stopBtn.addEventListener('click', () => { stopRequested = true; });
const statusEl = document.getElementById('status');
const promptEl = document.getElementById('prompt');

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (typeof content === 'string') {
    div.innerHTML = formatContent(content);
  } else {
    div.appendChild(content);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function formatContent(text) {
  // Basic markdown: code blocks, inline code, bold
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Convert screenshot references
  html = html.replace(/\[截图\]\(screenshotId:([\w-]+)\)/g, '<img src="/api/screenshots/$1" alt="screenshot">');
  return html;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addToolMessage(toolName, status, output) {
  const div = document.createElement('div');
  div.className = 'msg tool';
  let html = `<div><span class="tool-name">${escapeHtml(toolName)}</span> <span class="tool-status">${escapeHtml(status)}</span></div>`;
  if (output) {
    const display = typeof output === 'string' ? output : JSON.stringify(output, null, 2);
    html += `<div class="tool-output">${escapeHtml(display.slice(0, 500))}${display.length > 500 ? '...' : ''}</div>`;
  }
  div.innerHTML = html;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage(text) {
  if (running) return;
  running = true;
  stopRequested = false;
  sendBtn.disabled = true;
  stopBtn.classList.remove('hidden');
  statusEl.textContent = '思考中...';
  addMessage('user', text);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  const typingEl = addMessage('assistant', '');
  typingEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  try {
    const body = {
      input: text,
      context: { timestamp: new Date().toISOString(), platform: 'android' },
      stepMode: true,
      ...(promptEl.value !== 'free-form' ? { promptName: promptEl.value } : {}),
    };

    let result = await fetch(`${BASE}/v1/agent/sessions/${sessionId}/run`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
      body: JSON.stringify(body),
    }).then(r => r.json());

    let stepCount = 0;
    while (result.type === 'pending_tool_calls') {
      // flutter-dev-bff 全是 server 工具，正常不会走到这里；保留防御。
      typingEl.innerHTML = '等待工具执行...';
      break;
    }
    while (result.type === 'step_done') {
      if (stopRequested) {
        typingEl.innerHTML = '已停止';
        break;
      }
      stepCount += 1;
      statusEl.textContent = `思考中…（第 ${stepCount} 步）`;
      result = await fetch(`${BASE}/v1/agent/sessions/${sessionId}/continue`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
        body: JSON.stringify({ context: { timestamp: new Date().toISOString(), platform: 'android' } }),
      }).then((r) => r.json());
    }

    if (result.type === 'final') {
      const output = typeof result.output === 'string' ? result.output : JSON.stringify(result.output, null, 2);
      typingEl.innerHTML = formatContent(output);
    } else if (result.code) {
      typingEl.className = 'msg assistant error';
      typingEl.textContent = `错误: ${result.message || result.code}`;
    }
  } catch (err) {
    typingEl.className = 'msg assistant error';
    typingEl.textContent = `请求失败: ${err.message}`;
  } finally {
    running = false;
    stopRequested = false;
    sendBtn.disabled = false;
    stopBtn.classList.add('hidden');
    statusEl.textContent = '就绪';
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', () => {
  const text = inputEl.value.trim();
  if (text) sendMessage(text);
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (text) sendMessage(text);
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Load session history on startup
(async () => {
  try {
    const res = await fetch(`${BASE}/api/sessions/${sessionId}/messages`, {
      headers: { 'Authorization': `Bearer ${TOKEN}` },
    });
    if (res.ok) {
      const data = await res.json();
      for (const msg of (data.messages || [])) {
        if (msg.role === 'user' && typeof msg.content === 'string') {
          addMessage('user', msg.content);
        } else if (msg.role === 'assistant' && msg.content) {
          addMessage('assistant', typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content));
        } else if (msg.role === 'tool') {
          addToolMessage(msg.toolName || 'tool', 'done', msg.content);
        }
      }
    }
  } catch {
    // No history or server not reachable yet
  }
})();

// 放在脚本末尾：connectEvents 的回调引用 messagesEl / statusEl 等 const，
// 在它们声明之前调用会踩暂时性死区。
connectEvents();
</script>
</body>
</html>
